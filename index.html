
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Для тебя ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: radial-gradient(
                circle, #39132f, #090710
            );
            color: white;
            font-family: Georgia, serif;
            overflow: hidden;
            text-align: center;
        }

        .container {
            position: relative;
            z-index: 2;
            padding: 25px;
        }

        .heart {
            position: relative;
            width: 100px;
            height: 100px;
            margin: 60px auto;
            background: #ff3476;
            transform: rotate(-45deg);
            box-shadow: 0 0 60px #ff3476;
            animation: beat 1.5s infinite;
            cursor: pointer;
        }

        .heart::before,
        .heart::after {
            content: "";
            position: absolute;
            width: 100px;
            height: 100px;
            background: #ff3476;
            border-radius: 50%;
        }

        .heart::before {
            top: -50px;
            left: 0;
        }

        .heart::after {
            left: 50px;
            top: 0;
        }

        @keyframes beat {
            0%, 100% {
                transform: rotate(-45deg) scale(1);
            }
            15%, 45% {
                transform: rotate(-45deg) scale(1.15);
            }
            30%, 65% {
                transform: rotate(-45deg) scale(1);
            }
        }

        h1 {
            font-size: 36px;
            font-weight: normal;
            text-shadow: 0 0 20px #ff3476;
        }

        p {
            color: #ffc5dc;
            font-size: 18px;
            line-height: 1.6;
        }

        small {
            color: #b980a0;
            letter-spacing: 2px;
        }

        .particle {
            position: absolute;
            bottom: -30px;
            color: #ff719d;
            pointer-events: none;
            animation: float linear infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(0);
                opacity: 0;
            }
            20% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-115vh)
                           rotate(50deg);
                opacity: 0;
            }
        }

        .appear {
            animation: appear 1.5s ease;
        }

        @keyframes appear {
            from {
                opacity: 0;
                transform: translateY(15px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <small>ДЛЯ САМОЙ ОСОБЕННОЙ</small>

        <div class="heart" onclick="showLove()"></div>

        <h1>Ты — моё счастье</h1>

        <p id="message">
            Маленькое напоминание о том,<br>
            как сильно я тебя люблю.
        </p>

        <small id="hint">Нажми на сердце ♡</small>

    </div>

    <script>
        function showLove() {
            const message = document.getElementById("message");

            message.innerHTML =
                "С тобой даже самый обычный день<br>" +
                "становится особенным. ❤️";

            message.classList.remove("appear");
            void message.offsetWidth;
            message.classList.add("appear");

            document.getElementById("hint").innerText =
                "Ты — моё любимое совпадение.";
        }

        for (let i = 0; i < 40; i++) {
            const heart = document.createElement("div");

            heart.className = "particle";
            heart.innerHTML = Math.random() > 0.5
                ? "♥" : "♡";

            heart.style.left = Math.random() * 100 + "vw";
            heart.style.fontSize = 10 + Math.random() * 20 + "px";
            heart.style.animationDuration = 5 + Math.random() * 8 + "s";
            heart.style.animationDelay = -Math.random() * 12 + "s";

            document.body.appendChild(heart);
        }
    </script>

</body>
</html>
